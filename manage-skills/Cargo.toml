[package]
name = "manage-skills"
version = "0.1.0"
edition = "2021"
authors = ["Jack Roscoe <jack.x.roscoe@gmail.com>"]
description = "CLI tool to centralize and sync AI coding agent skills across harnesses"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"
walkdir = "2.5"
colored = "2.1"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"
