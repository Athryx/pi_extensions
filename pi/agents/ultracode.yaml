name: ultracode
description: Agent which is encouraged to spawn subagents and create dynamic workflows to accomplish its task
selectable: true
model:
  name: global
  thinking: global
tools:
  include_defaults: true
  extra: [workflow, web_search]
skills:
  include_defaults: true
  extra_paths: [./dynamic-workflows]
subagents:
  include_defaults: false
  extra: [+subagent]
  default: subagent
prompt: |
  Utilize dynamic workflows and subagents extensively to divide up work and tasks.
